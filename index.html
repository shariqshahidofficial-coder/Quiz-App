<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeClash - Coding Quiz</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-mode">
    <header>
        <div class="logo">Code<span>Clash</span></div>
        <button id="theme-toggle" class="btn btn-outline btn-sm">Toggle Theme</button>
    </header>

    <main>
        <!-- Topic Selection Screen -->
        <section id="start-screen" class="quiz-section">
            <div class="quiz-panel">
                <h2 class="section-title">Test your coding skills</h2>
                <p class="subtitle">Pick a topic and answer 10 questions. Quick, fun and no pressure.</p>

                <label class="field-label" for="player-name">Your name</label>
                <input type="text" id="player-name" maxlength="20" placeholder="e.g. Rahul">

                <label class="field-label">Choose a topic</label>
                <div class="topic-grid" id="topic-grid"></div>

                <div id="high-score" class="high-score"></div>
            </div>
        </section>

        <!-- Quiz Screen -->
        <section id="quiz-screen" class="quiz-section hidden">
            <div class="quiz-stats">
                <div class="stat">Score <span id="score">0</span></div>
                <div class="stat">Question <span id="q-index">1</span>/<span id="q-total">10</span></div>
                <div class="stat">Time <span id="timer">20</span>s</div>
            </div>
            <div class="progress-bar"><div id="progress-fill"></div></div>
            <div id="question-text" class="question-text">Question loading...</div>
            <div id="options" class="options"></div>
            <div class="quiz-nav">
                <button id="next-btn" class="btn btn-primary">Next</button>
            </div>
        </section>

        <!-- Result Screen -->
        <section id="result-screen" class="quiz-section hidden">
            <div class="quiz-panel">
                <h2 class="section-title">Quiz complete!</h2>
                <div id="result-topic" class="result-topic"></div>
                <div id="result-player" class="result-player"></div>
                <div id="result-score" class="result-score">0/10</div>
                <div id="result-msg" class="result-msg"></div>
                <div class="result-actions">
                    <button id="retry-btn" class="btn btn-primary">Play Again</button>
                    <button id="topics-btn" class="btn btn-outline">All Topics</button>
                </div>
            </div>
        </section>
    </main>

    <div id="alarm-overlay" class="hidden">
        <div class="alarm-modal">
            <h1>Time's up!</h1>
            <p>You didn't pick an answer in time. No worries, move on!</p>
            <button id="dismiss-alarm" class="btn btn-primary">Continue</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
